<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="2 2 96 96" role="img" aria-label="BreezyGames kite icon" xmlns:c2pa="http://c2pa.org/manifest">
  <!--
    BreezyGames icon palette

    Name        Color      Grayscale   Used by
    ==========  =========  ==========  ====================================
    Deep Teal   #0B5A66    #4A4A4A     .tile
    White       #FFFFFF    #FFFFFF     .kite-tl, .kite-br, .bow-2, .grid
    Sky Blue    #BFE9EE    #E0E0E0     .kite-tr, .string, .wind
    Sunny       #FFC83D    #CACACA     .kite-bl, .bow-1

    Grayscale values use Rec. 709 luma (0.2126 R + 0.7152 G + 0.0722 B),
    the same conversion as a standard grayscale filter.
    Lightness: Teal 29%, Sunny 79%, Sky Blue 88%, White 100%.
  -->
 <style>
    /* Edit colors here */
    .tile       { fill: #55B3C9; }
    .grid       { stroke: #FFFFFF; stroke-opacity: .35; }
    .kite-tl    { fill: #0B2A4A; }
    .kite-tr    { fill: #F2B84B; }
    .kite-bl    { fill: #F2B84B; }
    .kite-br    { fill: #0B2A4A; }
    .string     { stroke: #0B2A4A; }
    .bow-1      { fill: #F2B84B; }
    .bow-2      { fill: #0B2A4A; }
    .wind       { stroke: #FFFFFF; }
    .wordmark   { font-family: 'Fredoka', 'Nunito', 'Varela Round', 'Arial Rounded MT Bold', Arial, sans-serif; font-size: 112px; }
  </style>

  <!-- Full-frame panel with rounded corners. The corners are transparent;
       change rx to adjust the roundness (0 = square). -->
  <rect class="tile" x="2" y="2" width="96" height="96" rx="22"/>
  <path class="grid" d="M35 8V92M65 8V92M8 35H92M8 65H92" fill="none" stroke-width="1.5"/>

  <path class="kite-tl" d="M50 10L28 38H50Z"/>
  <path class="kite-tr" d="M50 10L72 38H50Z"/>
  <path class="kite-bl" d="M28 38L50 70V38Z"/>
  <path class="kite-br" d="M72 38L50 70V38Z"/>

  <path class="string" d="M50 70C38 76 62 81 50 90" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  <circle class="bow-1" cx="46" cy="77" r="3.2"/>
  <circle class="bow-2" cx="53" cy="83" r="3.2"/>

  <path class="wind" d="M74 62q7-4 14 0M78 72q6-3 12 0" fill="none" stroke-width="2.5" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
